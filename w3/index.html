<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>哆啦A夢風 迷因產生器 🔔 Meme Generator</title>
  
  <!-- 引入 Google Fonts 可愛圓體字型 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
  
  <!-- 引入 html2canvas 庫（下載畫布截圖） -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            doraBlue: '#0096E6',
            doraDarkBlue: '#0070B8',
            doraRed: '#FF3B30',
            doraYellow: '#FFD600',
            doraWhite: '#FAFAFA',
            doraBg: '#E6F4FE',
          },
          fontFamily: {
            rounded: ['"Zen Maru Gothic"', '"Noto Sans TC"', 'sans-serif'],
          },
          boxShadow: {
            'dora': '0 8px 0px #0070B8, 0 12px 20px rgba(0, 150, 230, 0.25)',
            'bell': '0 4px 0px #C5A000, 0 6px 12px rgba(0,0,0,0.15)',
            'pocket': '0 8px 24px rgba(0,0,0,0.08)',
          }
        }
      }
    }
  </script>

  <style>
    body {
      font-family: 'Zen Maru Gothic', 'Noto Sans TC', sans-serif;
      background-color: #E6F4FE;
      background-image: radial-gradient(#BBE1FA 15%, transparent 16%);
      background-size: 24px 24px;
    }

    /* 哆啦A夢風格鈴鐺裝飾 */
    .bell-icon {
      position: relative;
      background: linear-gradient(135deg, #FFEA79 0%, #FFD600 100%);
      border: 3px solid #333;
      border-radius: 50%;
      width: 44px;
      height: 44px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 0 #D4A700;
    }

    .bell-icon::before {
      content: '';
      position: absolute;
      top: 14px;
      width: 100%;
      height: 4px;
      background: #333;
    }

    .bell-icon::after {
      content: '';
      position: absolute;
      top: 24px;
      width: 10px;
      height: 10px;
      background: #333;
      border-radius: 50%;
    }

    /* 百寶袋造型容器 */
    .pocket-card {
      background: #FFFFFF;
      border: 4px solid #333333;
      border-radius: 32px;
      position: relative;
    }

    /* 可愛標籤頁與卡片標題邊框 */
    .dora-border {
      border: 3px solid #333;
    }

    /* 迷因文字效果：粗黑描邊邊框 */
    .meme-text {
      font-family: 'Zen Maru Gothic', 'Noto Sans TC', sans-serif;
      font-weight: 900;
      text-transform: uppercase;
      word-break: break-word;
      user-select: none;
      pointer-events: none;
      line-height: 1.2;
    }

    /* 自訂滑桿樣式 */
    input[type=range] {
      accent-color: #FF3B30;
    }
  </style>
</head>
<body class="min-h-screen text-gray-800 pb-12">

  <!-- 頂部標題列（紅領帶風格） -->
  <header class="bg-doraRed border-b-4 border-gray-900 shadow-md py-4 px-4 sticky top-0 z-50">
    <div class="max-w-4xl mx-auto flex items-center justify-between">
      <div class="flex items-center gap-3">
        <!-- 經典金屬鈴鐺 -->
        <div class="bell-icon flex-shrink-0"></div>
        <div>
          <h1 class="text-2xl md:text-3xl font-black text-white tracking-wider drop-shadow-[0_2px_0_#000]">
            神奇迷因產生器
          </h1>
          <p class="text-xs text-yellow-200 font-bold hidden sm:block">哆啦A夢的秘密道具 ‧ 製作專屬於你的爆笑迷因！</p>
        </div>
      </div>
      
      <!-- 右側按鈕或標語 -->
      <span class="bg-doraYellow border-2 border-gray-900 text-gray-900 text-xs md:text-sm font-extrabold px-3 py-1.5 rounded-full shadow-[2px_2px_0px_#000]">
        DORA-MEME ⚡
      </span>
    </div>
  </header>

  <!-- 主要內容區 -->
  <main class="max-w-5xl mx-auto px-4 mt-6">
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">

      <!-- 左側：控制面板（百寶袋風格） -->
      <section class="lg:col-span-5 pocket-card p-5 md:p-6 shadow-dora">
        
        <!-- 卡片標題飾條 -->
        <div class="flex items-center gap-2 mb-5 pb-3 border-b-4 border-dashed border-doraBlue">
          <div class="w-4 h-4 bg-doraRed rounded-full border-2 border-black"></div>
          <h2 class="text-xl font-black text-doraDarkBlue">道具控制台</h2>
        </div>

        <div class="space-y-5">
          
          <!-- 1. 底圖來源區 -->
          <div>
            <label class="block text-sm font-black text-gray-700 mb-2">
              📁 1. 選擇或上傳背景圖
            </label>
            <div class="flex flex-col gap-2">
              <label class="cursor-pointer flex items-center justify-center bg-doraBlue hover:bg-doraDarkBlue text-white font-bold py-3 px-4 rounded-2xl border-3 border-gray-900 shadow-[0_4px_0_#000] active:translate-y-1 active:shadow-[0_0_0_#000] transition-all">
                <span class="text-lg mr-2">📷</span> 上傳本機圖片
                <input type="file" id="imageInput" accept="image/*" class="hidden">
              </label>

              <!-- 預設測試圖按鈕 -->
              <div class="flex gap-2 mt-1">
                <button type="button" onclick="loadPresetImage('blue')" class="flex-1 bg-sky-100 hover:bg-sky-200 text-doraDarkBlue font-bold py-1.5 text-xs rounded-xl border-2 border-gray-800 shadow-[2px_2px_0_#000]">
                  藍色經典底圖
                </button>
                <button type="button" onclick="loadPresetImage('yellow')" class="flex-1 bg-yellow-100 hover:bg-yellow-200 text-amber-800 font-bold py-1.5 text-xs rounded-xl border-2 border-gray-800 shadow-[2px_2px_0_#000]">
                  黃色歡樂底圖
                </button>
              </div>
            </div>
          </div>

          <!-- 2. 文字輸入區 -->
          <div class="space-y-3 pt-2">
            <div>
              <label for="topTextInput" class="block text-sm font-black text-gray-700 mb-1">
                ✏️ 2. 上方文字 (Top Text)
              </label>
              <input type="text" id="topTextInput" value="當你拿到新道具" 
                class="w-full bg-blue-50 border-3 border-gray-900 rounded-xl px-3 py-2 text-gray-900 font-bold focus:outline-none focus:ring-4 focus:ring-doraYellow shadow-[2px_2px_0_#000]" placeholder="輸入上方文字...">
            </div>

            <div>
              <label for="bottomTextInput" class="block text-sm font-black text-gray-700 mb-1">
                ✏️ 3. 下方文字 (Bottom Text)
              </label>
              <input type="text" id="bottomTextInput" value="但發現根本不會用的時候" 
                class="w-full bg-blue-50 border-3 border-gray-900 rounded-xl px-3 py-2 text-gray-900 font-bold focus:outline-none focus:ring-4 focus:ring-doraYellow shadow-[2px_2px_0_#000]" placeholder="輸入下方文字...">
            </div>
          </div>

          <!-- 3. 文字樣式調整 -->
          <div class="bg-blue-50/80 p-4 rounded-2xl border-3 border-gray-900 space-y-4">
            <h3 class="text-sm font-black text-doraDarkBlue flex items-center gap-1">
              🎨 4. 文字細節調整
            </h3>

            <!-- 字型大小 -->
            <div>
              <div class="flex justify-between text-xs font-bold text-gray-700 mb-1">
                <span>字型大小 (Font Size)</span>
                <span id="fontSizeVal">36px</span>
              </div>
              <input type="range" id="fontSizeSlider" min="20" max="72" value="36" class="w-full cursor-pointer">
            </div>

            <!-- 文字顏色與邊框顏色 -->
            <div class="grid grid-cols-2 gap-3">
              <div>
                <label class="block text-xs font-bold text-gray-700 mb-1">文字填充色</label>
                <div class="flex items-center gap-2">
                  <input type="color" id="textColorPicker" value="#FFFFFF" class="w-10 h-10 border-2 border-gray-900 rounded-lg cursor-pointer">
                  <span class="text-xs font-mono font-bold text-gray-600" id="textColorHex">#FFFFFF</span>
                </div>
              </div>
              <div>
                <label class="block text-xs font-bold text-gray-700 mb-1">外框描邊色</label>
                <div class="flex items-center gap-2">
                  <input type="color" id="strokeColorPicker" value="#000000" class="w-10 h-10 border-2 border-gray-900 rounded-lg cursor-pointer">
                  <span class="text-xs font-mono font-bold text-gray-600" id="strokeColorHex">#000000</span>
                </div>
              </div>
            </div>

            <!-- 垂直位置偏移 (OffsetY) -->
            <div>
              <div class="flex justify-between text-xs font-bold text-gray-700 mb-1">
                <span>邊距偏移 (Margin Offset)</span>
                <span id="offsetVal">16px</span>
              </div>
              <input type="range" id="offsetSlider" min="5" max="50" value="16" class="w-full cursor-pointer">
            </div>
          </div>

          <!-- 4. 一鍵下載按鈕 -->
          <button type="button" id="downloadBtn" 
            class="w-full bg-doraYellow hover:bg-yellow-400 text-gray-900 text-xl font-black py-4 px-6 rounded-2xl border-4 border-gray-900 shadow-[0_6px_0_#000] active:translate-y-1.5 active:shadow-[0_0_0_#000] transition-all flex items-center justify-center gap-2">
            <span>✨ 下載迷因圖 PNG</span>
          </button>

        </div>
      </section>


      <!-- 右側：迷因即時預覽區（相框 / 螢幕風格） -->
      <section class="lg:col-span-7 flex flex-col items-center">
        
        <!-- 相框外殼 -->
        <div class="w-full pocket-card p-4 md:p-6 bg-white shadow-dora flex flex-col items-center">
          
          <div class="w-full flex items-center justify-between mb-4">
            <span class="font-black text-gray-800 text-base md:text-lg flex items-center gap-2">
              <span class="inline-block w-3 h-3 rounded-full bg-doraRed border border-black"></span>
              即時畫布預覽 (Live Preview)
            </span>
            <span class="text-xs bg-sky-100 text-doraDarkBlue border border-doraBlue font-bold px-2.5 py-1 rounded-full">
              自動縮放匹配
            </span>
          </div>

          <!-- 可匯出的迷因容器（html2canvas 截圖目標） -->
          <div id="memeContainer" class="relative overflow-hidden border-4 border-gray-900 rounded-2xl bg-gray-900 flex items-center justify-center max-w-full min-h-[300px] shadow-[inset_0_4px_12px_rgba(0,0,0,0.5)]">
            
            <!-- 底圖背景 -->
            <img id="memeImage" src="" alt="Meme Background" class="max-w-full h-auto block object-contain max-h-[550px]" style="display: none;">
            
            <!-- 預設加載前的占位提示 (Placeholder) -->
            <div id="placeholderBox" class="p-8 text-center text-gray-300 flex flex-col items-center gap-3">
              <div class="w-20 h-20 rounded-full bg-doraBlue border-4 border-white flex items-center justify-center text-4xl shadow-lg">
                🔔
              </div>
              <p class="font-bold text-sm text-gray-200">請點擊左側「上傳圖片」<br>或選擇預設底圖開始製作！</p>
            </div>

            <!-- 上方迷因文字 -->
            <div id="topTextDisplay" class="meme-text absolute top-4 left-0 w-full text-center px-4 leading-tight"></div>

            <!-- 下方迷因文字 -->
            <div id="bottomTextDisplay" class="meme-text absolute bottom-4 left-0 w-full text-center px-4 leading-tight"></div>
          </div>

          <!-- 底層說明小字 -->
          <p class="text-xs text-gray-600 font-bold mt-4 text-center">
            💡 提示：使用 <code class="bg-gray-100 border px-1 rounded">html2canvas</code> 原生截圖技術，導出高解析度圖檔不走伺服器，安全零延遲！
          </p>
        </div>

      </section>

    </div>
  </main>

  <!-- JavaScript 邏輯庫 -->
  <script>
    // DOM 元素引用
    const imageInput = document.getElementById('imageInput');
    const memeImage = document.getElementById('memeImage');
    const placeholderBox = document.getElementById('placeholderBox');
    const memeContainer = document.getElementById('memeContainer');

    const topTextInput = document.getElementById('topTextInput');
    const bottomTextInput = document.getElementById('bottomTextInput');
    const topTextDisplay = document.getElementById('topTextDisplay');
    const bottomTextDisplay = document.getElementById('bottomTextDisplay');

    const fontSizeSlider = document.getElementById('fontSizeSlider');
    const fontSizeVal = document.getElementById('fontSizeVal');
    const textColorPicker = document.getElementById('textColorPicker');
    const strokeColorPicker = document.getElementById('strokeColorPicker');
    const textColorHex = document.getElementById('textColorHex');
    const strokeColorHex = document.getElementById('strokeColorHex');
    
    const offsetSlider = document.getElementById('offsetSlider');
    const offsetVal = document.getElementById('offsetVal');

    const downloadBtn = document.getElementById('downloadBtn');

    // 初始化與文字即時渲染
    function updateText() {
      const topText = topTextInput.value;
      const bottomText = bottomTextInput.value;

      topTextDisplay.innerText = topText;
      bottomTextDisplay.innerText = bottomText;

      // 樣式更新
      const fontSize = fontSizeSlider.value + 'px';
      const textColor = textColorPicker.value;
      const strokeColor = strokeColorPicker.value;
      const offset = offsetSlider.value + 'px';

      // 數值顯示更新
      fontSizeVal.innerText = fontSize;
      offsetVal.innerText = offset;
      textColorHex.innerText = textColor.toUpperCase();
      strokeColorHex.innerText = strokeColor.toUpperCase();

      // 套用至上方與下方文字
      [topTextDisplay, bottomTextDisplay].forEach((el) => {
        el.style.fontSize = fontSize;
        el.style.color = textColor;
        
        // 使用多重 text-shadow 打造優良的全角度描邊
        const sc = strokeColor;
        el.style.textShadow = `
          3px 3px 0 ${sc},
          -3px -3px 0 ${sc},
          3px -3px 0 ${sc},
          -3px 3px 0 ${sc},
          0px 3px 0 ${sc},
          0px -3px 0 ${sc},
          3px 0px 0 ${sc},
          -3px 0px 0 ${sc},
          0px 4px 8px rgba(0,0,0,0.5)
        `;
      });

      topTextDisplay.style.top = offset;
      bottomTextDisplay.style.bottom = offset;
    }

    // 1. 本機圖片讀取處理 (FileReader)
    imageInput.addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(event) {
          memeImage.src = event.target.result;
          memeImage.style.display = 'block';
          placeholderBox.style.display = 'none';
          updateText();
        };
        reader.readAsDataURL(file);
      }
    });

    // 2. 預設SVG背景圖產生器（防止外部圖片跨域）
    function loadPresetImage(type) {
      const canvas = document.createElement('canvas');
      canvas.width = 600;
      canvas.height = 450;
      const ctx = canvas.getContext('2d');

      if (type === 'blue') {
        // 天藍色漸層背景
        const grad = ctx.createLinearGradient(0, 0, 600, 450);
        grad.addColorStop(0, '#0096E6');
        grad.addColorStop(1, '#005C99');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, 600, 450);

        // 畫白色大圓圈 (哆啦A夢肚子)
        ctx.fillStyle = '#FFFFFF';
        ctx.beginPath();
        ctx.arc(300, 320, 180, 0, Math.PI * 2);
        ctx.fill();
        ctx.lineWidth = 6;
        ctx.strokeStyle = '#333333';
        ctx.stroke();

        // 畫紅領帶與黃鈴鐺
        ctx.fillStyle = '#FF3B30';
        ctx.fillRect(180, 140, 240, 24);
        ctx.strokeRect(180, 140, 240, 24);

        ctx.fillStyle = '#FFD600';
        ctx.beginPath();
        ctx.arc(300, 175, 24, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
      } else {
        // 黃色驚喜背景
        const grad = ctx.createLinearGradient(0, 0, 600, 450);
        grad.addColorStop(0, '#FFEA79');
        grad.addColorStop(1, '#FFD600');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, 600, 450);

        // 放射狀幾何線條
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
        ctx.lineWidth = 10;
        for (let i = 0; i < 360; i += 30) {
          ctx.beginPath();
          ctx.moveTo(300, 225);
          const x = 300 + 400 * Math.cos((i * Math.PI) / 180);
          const y = 225 + 400 * Math.sin((i * Math.PI) / 180);
          ctx.lineTo(x, y);
          ctx.stroke();
        }
      }

      memeImage.src = canvas.toDataURL('image/png');
      memeImage.style.display = 'block';
      placeholderBox.style.display = 'none';
      updateText();
    }

    // 3. 截圖並下載迷因 (html2canvas)
    downloadBtn.addEventListener('click', function() {
      if (memeImage.style.display === 'none') {
        alert('請先上傳圖片或選擇預設底圖喔！🔔');
        return;
      }

      // 提示下載中狀態
      const originalText = downloadBtn.innerHTML;
      downloadBtn.innerHTML = `<span>⏳ 魔法生成中...</span>`;
      downloadBtn.disabled = true;

      // 調用 html2canvas 導出圖片
      html2canvas(memeContainer, {
        scale: 2, // 高解析度導出
        useCORS: true,
        backgroundColor: null
      }).then((canvas) => {
        // 建立下載超連結
        const link = document.createElement('a');
        link.download = `dora-meme-${Date.now()}.png`;
        link.href = canvas.toDataURL('image/png');
        link.click();

        // 恢復按鈕狀態
        downloadBtn.innerHTML = originalText;
        downloadBtn.disabled = false;
      }).catch((err) => {
        console.error('截圖失敗:', err);
        alert('下載失敗，請重新試一次。');
        downloadBtn.innerHTML = originalText;
        downloadBtn.disabled = false;
      });
    });

    // 事件監聽綁定
    [topTextInput, bottomTextInput, fontSizeSlider, textColorPicker, strokeColorPicker, offsetSlider].forEach((input) => {
      input.addEventListener('input', updateText);
    });

    // 預設載入首張底圖
    window.onload = function() {
      loadPresetImage('blue');
    };
  </script>

</body>
</html>
