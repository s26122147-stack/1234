<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>個人數位名片</title>
  <style>
    /* 1. 全域重設與整體背景 */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      /* 清新水藍色漸層背景 */
      background: linear-gradient(135deg, #e0f2fe 0%, #bae6fd 100%);
      min-height: 100vh;
      /* 畫面內容垂直與水平置中 */
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    /* 2. 名片卡片本體 */
    .card {
      background-color: #ffffff;
      width: 100%;
      max-width: 320px;
      padding: 35px 25px;
      border-radius: 24px;
      /* 現代感輕柔微陰影 */
      box-shadow: 0 12px 32px rgba(14, 116, 144, 0.12);
      text-align: center;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    /* 滑鼠懸停於卡片時的懸浮動態效果 */
    .card:hover {
      transform: translateY(-6px);
      box-shadow: 0 16px 40px rgba(14, 116, 144, 0.18);
    }

    /* 3. 圓形大頭貼 */
    .avatar {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 20px;
      border: 4px solid #f0f9ff;
      box-shadow: 0 4px 12px rgba(56, 189, 248, 0.25);
    }

    /* 4. 姓名與簡短自我介紹 */
    .name {
      font-size: 1.5rem;
      color: #0c4a6e;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .bio {
      font-size: 0.9rem;
      color: #0369a1;
      line-height: 1.6;
      margin-bottom: 28px;
    }

    /* 5. 按鈕區塊與樣式 */
    .button-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 12px 0;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.2s ease;
    }

    /* IG 按鈕：水藍主色 */
    .btn-ig {
      background-color: #0284c7;
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.25);
    }

    .btn-ig:hover {
      background-color: #0369a1;
      box-shadow: 0 6px 16px rgba(2, 132, 199, 0.35);
    }

    /* Email 按鈕：淺水藍色 */
    .btn-email {
      background-color: #e0f2fe;
      color: #0369a1;
    }

    .btn-email:hover {
      background-color: #bae6fd;
      color: #0284c7;
    }
  </style>
</head>
<body>

  <!-- 卡片主要結構 -->
  <div class="card">
    
    <!-- 圓形大頭貼（可替換為你的照片網址） -->
    <img src="https://i.postimg.cc/1zHM8WZK/E621E4CE-9987-4C95-9B62-AB8731279BD2.jpg" alt="個人大頭貼" class="avatar">
    
    <!-- 姓名 -->
    <h1 class="name">你的名字</h1>
    
    <!-- 簡短自我介紹 -->
    <p class="bio">熱愛生活與設計的跨界創作者，用視覺講述每一個獨特的故事。</p>
    
    <!-- 按鈕區域 -->
    <div class="button-group">
      <!-- IG 連結按鈕 -->
      <a href="https://www.instagram.com/pip._.466?mdxt=MWhqenpoMGpvN2Qzag%3D%3D&utm_source=qr" target="_blank" class="btn btn-ig">
        Instagram
      </a>
      
      <!-- Email 聯絡按鈕 -->
      <a href="mailto:your_email@example.com" class="btn btn-email">
        Email 聯絡我
      </a>
    </div>

  </div>

</body>
</html>
