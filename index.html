<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>甜心程式設計師的作品集 Portfolio</title>
    <!-- 導入可愛圓體字型與 FontAwesome 圖示 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=Zen+Maru+Gothic:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #ffd1dc 0%, #ffe4e1 35%, #e6e6fa 70%, #d8bfd8 100%);
            --pink-primary: #ff8da1;
            --pink-secondary: #ffb6c1;
            --purple-accent: #b19ffb;
            --cream-bg: #fffbf7;
            --text-color: #6b4e71;
            --locked-bg: #e2d9e2;
            --locked-text: #a092a0;
            --card-shadow: 0 15px 35px rgba(238, 174, 202, 0.4);
            --glow-light: 0 0 20px rgba(255, 182, 193, 0.8);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Zen Maru Gothic', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            min-height: 100vh;
            background: var(--bg-gradient);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 2rem 1rem;
            color: var(--text-color);
            position: relative;
            overflow-x: hidden;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* 漂浮氣泡背景 */
        .bg-decorations {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .floating-bubble {
            position: absolute;
            background: rgba(255, 255, 255, 0.45);
            border-radius: 50%;
            animation: floatUp 8s infinite linear;
